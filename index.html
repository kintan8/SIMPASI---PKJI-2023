    const { useState, useEffect, useMemo, useRef } = React;

    // --- PKJI 2023 REFERENCE CONSTANTS & PARAMETERS ---

    // Passenger Car Equivalents (EMP / smp) PKJI 2023
    const EMP_PKJI = {

      O: { KR: 1.0, KB: 1.30, SM: 0.40, KT: 0.0 }  // Terlawan (Opposed)
    };

    // Default Intersection Data (Magelang Case Study)
    const DEFAULT_DATA = {

        junctionType: "4-WAY", // '4-WAY' or '3-WAY'
        tJunctionOmitted: "B", // 'U', 'S', 'T', or 'B' (if 3-WAY)

      approaches: [

    // Preset Scenarios
    const PRESET_SCENARIOS = {

      },
      twoPhase: {
        title: "Simpang 4 Terlindung (2 Fase Sederhana)",

    // Tooltip / Recommendation content database
    const GUIDANCE_INFO = {
      junctionType: {
        title: "Tipe Simpang: Simpang 4 Lengan vs Simpang 3 Lengan (T-Junction)",
        recommendation: "Pilih Simpang 3 Lengan jika salah satu lengan buntu / tidak terdapat akses jalan. PKJI 2023 mencatat simpang 3 memiliki titik konflik jauh lebih sedikit (9 konflik vs 32 konflik pada simpang 4).",
        pros: [

        ]
      },
      numPhases: {
        title: "Pedoman Pemilihan Jumlah Fase APILL (PKJI 2023)",
        recommendation: "Pilih 2 Fase untuk simpang sedang tanpa arus belok kanan berat (< 200 smp/jam). Pilih 3 atau 4 fase jika belok kanan padat demi keselamatan.",
        pros: [
          "2 Fase: Kapasitas simpang tertinggi, waktu siklus pendek, tundaan rata-rata kendaraan lebih rendah.",
          "3/4 Fase: Menghilangkan tabrakan titik konflik belok kanan (crossing conflict), lebih aman bagi pejalan kaki dan kendaraan."
        ],
        cons: [
          "2 Fase: Risiko tabrakan sudut (right-angle / head-on collision) tinggi bila volume belok kanan tinggi.",
          "3/4 Fase: Menambah waktu hilang total (L), waktu siklus lebih panjang, antrean memanjang pada lengan yang menunggu merah."
        ]
      },
      approachType: {
        title: "Pendekat Terlindung (P) vs Terlawan (O)",
        recommendation: "Gunakan tipe Terlindung (P) jika pergerakan belok kanan diberi fase terpisah atau dilarang. Gunakan Terlawan (O) jika belok kanan memotong arus lurus lawan.",
        pros: [
          "Terlindung (P): Arus jenuh optimal (S₀ = 600 × Wₑ), angka kecelakaan minim, kapasitas lebih terprediksi.",

        ],
        cons: [
          "Terlindung (P): Memerlukan fase tersendiri yang menambah waktu siklus.",
          "Terlawan (O): Nilai EMP SM naik drastis (0.40) & kapasitas tergerus hebat saat volume lurus arah lawan tinggi."
        ]
      },
      ltor: {
        title: "Belok Kiri Jalan Terus (LTOR - Left Turn On Red)",
        recommendation: "Disarankan hanya jika lajur keluar penerima memadai dan konflik pejalan kaki / penyeberang jalan terkontrol.",
        pros: [
          "Mengurangi volume arus yang memerlukan alokasi waktu hijau sinyal.",
          "Meningkatkan kapasitas efektif pendekat untuk pergerakan lurus dan belok kanan."
        ],

          "Meningkatkan potensi konflik samping pada lajur keluar.",
          "Mengurangi aspek keselamatan bagi penyeberang jalan (zebra cross)."
        ]
      },
      citySize: {
        title: "Faktor Ukuran Kota (Fcs)",
        recommendation: "Sesuaikan dengan jumlah penduduk wilayah aglomerasi perkotaan.",
        pros: ["Kota lebih besar (>3 Juta) memiliki pengemudi lebih agresif sehingga kapasitas arus jenuh naik (+5%)."],
        cons: ["Kota kecil (<100rb) pengemudi cenderung lebih santai / lambat merespons hijau (Fcs = 0.82, kapasitas turun -18%)."]
      },
      sideFriction: {
        title: "Faktor Hambatan Samping (Fsf)",
        recommendation: "Amati aktivitas pejalan kaki, angkot ngetem, kendaraan lambat, dan akses toko dalam jarak 200m dari simpang.",
        pros: ["Penertiban parkir liar dan PKL dapat mengembalikan kapasitas pendekat hingga 15%."],
        cons: ["Hambatan samping Tinggi/Sangat Tinggi menurunkan arus jenuh secara masif (Fsf turun ke 0.84 - 0.88)."]
      },
      gradient: {
        title: "Faktor Kelandaian Pendekat (FG)",
        recommendation: "Ukur kemiringan memanjang jalan dalam 100m menjelang garis henti.",
        pros: ["Turunan (G < 0%) mempermudah percepatan start kendaraan ringan."],
        cons: ["Tanjakan (G > 0%) memperlambat percepatan start kendaraan berat (KB/HV) dan mengurangi kapasitas."]
      }
    };

    // Modal Tooltip Component
    const GuidanceModal = ({ isOpen, type, onClose }) => {

      const info = GUIDANCE_INFO[type];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white dark:bg-slate-900 border border-amber-500/30 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <button 
              onClick={onClose} 
              className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white text-xl">
              <i className="fa-solid fa-xmark"></i>
            </button>
            <div className="flex items-center gap-3 mb-4">
              <div className="w-10 h-10 rounded-xl bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl font-bold">
                💡
              </div>
              <h3 className="text-lg font-bold text-slate-800 dark:text-white leading-tight">
                {info.title}
              </h3>
            </div>
            
            <div className="bg-amber-50 dark:bg-amber-950/30 border-l-4 border-amber-500 p-3 rounded text-sm text-amber-900 dark:text-amber-200 mb-4">
              <span className="font-semibold">Rekomendasi Teknis PKJI 2023:</span> {info.recommendation}
            </div>

            <div className="space-y-3 text-sm">
              <div className="p-3 bg-emerald-50 dark:bg-emerald-950/20 border border-emerald-200 dark:border-emerald-800/40 rounded-xl">
                <div className="font-bold text-emerald-800 dark:text-emerald-300 flex items-center gap-1.5 mb-1.5">
                  <i className="fa-solid fa-circle-plus"></i> Keuntungan (Pros)
                </div>
                <ul className="list-disc list-inside space-y-1 text-slate-700 dark:text-slate-300 text-xs">
                  {info.pros.map((p, i) => <li key={i}>{p}</li>)}
                </ul>
              </div>

              <div className="p-3 bg-rose-50 dark:bg-rose-950/20 border border-rose-200 dark:border-rose-800/40 rounded-xl">
                <div className="font-bold text-rose-800 dark:text-rose-300 flex items-center gap-1.5 mb-1.5">
                  <i className="fa-solid fa-circle-minus"></i> Kekurangan / Risiko (Cons)
                </div>
                <ul className="list-disc list-inside space-y-1 text-slate-700 dark:text-slate-300 text-xs">

              </div>

            <div className="mt-5 flex justify-end">
              <button
                onClick={onClose}

    };

    // Math Explanation Card Component
    const FormulaCard = ({ title, formula, substitute, explanation, ruleRef }) => {
      const [isOpen, setIsOpen] = useState(false);

      return (
        <div className="mt-4 border border-slate-200 dark:border-slate-800 rounded-xl bg-slate-50/80 dark:bg-slate-900/60 overflow-hidden text-xs">
          <button
            onClick={() => setIsOpen(!isOpen)}
            className="w-full flex items-center justify-between px-4 py-2.5 bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold transition-colors">
            <span className="flex items-center gap-2">
              <i className="fa-solid fa-square-root-variable text-blue-600 dark:text-blue-400"></i>
              <span>Transparansi Rumus & Logika: <strong>{title}</strong></span>
            </span>
            <span className="text-slate-400 flex items-center gap-1">
              <span>{isOpen ? "Sembunyikan" : "Buka Rumus"}</span>
              <i className={`fa-solid fa-chevron-${isOpen ? "up" : "down"}`}></i>
            </span>
          </button>
          
          {isOpen && (
            <div className="p-4 space-y-3 animate-fade-in">
              <div className="bg-white dark:bg-slate-950 p-3 rounded-lg border border-slate-200 dark:border-slate-800 font-mono text-blue-700 dark:text-blue-300 text-sm shadow-inner">
                {formula}
              </div>
              
              {substitute && (
                <div className="p-2.5 bg-amber-50/60 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900/40 rounded text-slate-800 dark:text-amber-200 font-mono text-xs">
                  <span className="font-semibold text-amber-700 dark:text-amber-400">Substitusi Angka: </span>
                  {substitute}
                </div>
              )}

              <div className="text-slate-600 dark:text-slate-300 leading-relaxed">
                <span className="font-bold text-slate-800 dark:text-slate-100">💡 Mengapa rumus ini digunakan?</span>
                <p className="mt-1">{explanation}</p>
                {ruleRef && (
                  <p className="mt-1 text-[11px] text-slate-400 italic">
                    Referensi: {ruleRef}
                  </p>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    // Top-down 2D Simulation Canvas Component with High-Fidelity Vehicles & Queue Dynamics
    const TopDownSimulation = ({ approaches, signalPlan, currentActivePhase, cycleTime, junctionType = '4-WAY', tJunctionOmitted = 'B' }) => {
      const canvasRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(true);
      const [simSpeed, setSimSpeed] = useState(1);
      const [elapsedCycleTime, setElapsedCycleTime] = useState(0);
      const animFrameRef = useRef(null);
      const vehiclesRef = useRef([]);

      const is3Way = junctionType === '3-WAY';
      const omitted = tJunctionOmitted;

      // Initialize Vehicle Fleet with realistic vehicle types and proportions
      useEffect(() => {
        const vehicles = [];
        const approachDirs = ['N', 'S', 'E', 'W'];
        const activeDirs = approachDirs.filter(dir => {
          if (is3Way) {
            if (dir === 'N' && omitted === 'U') return false;
            if (dir === 'S' && omitted === 'S') return false;
            if (dir === 'E' && omitted === 'T') return false;
            if (dir === 'W' && omitted === 'B') return false;
          }
          return true;
        });

        const carColors = ['#f8fafc', '#1e3a8a', '#dc2626', '#94a3b8', '#eab308', '#0f172a', '#059669'];
        const helmetColors = ['#16a34a', '#dc2626', '#f59e0b', '#ffffff', '#2563eb', '#334155'];

        let idCounter = 1;
        activeDirs.forEach(dir => {
          // Find matching approach config
          const app = approaches.find(a => 
            (dir === 'N' && a.id === 'U') ||
            (dir === 'S' && a.id === 'S') ||
            (dir === 'E' && a.id === 'T') ||
            (dir === 'W' && a.id === 'B')
          ) || { flows: { KR: 400, KB: 50, SM: 1000 } };

          const totalFlow = (app.flows?.KR || 400) + (app.flows?.KB || 50) + (app.flows?.SM || 1000);
          const probSM = (app.flows?.SM || 1000) / totalFlow;
          const probKR = probSM + ((app.flows?.KR || 400) / totalFlow);

          // 20 vehicles per approach staged at distances 20m to 280m
          for (let i = 0; i < 20; i++) {
            const rand = Math.random();
            let type = 'SM';
            let length = 16, width = 8, sublane = (Math.random() < 0.33 ? -8 : (Math.random() < 0.66 ? 0 : 8));
            if (rand < probSM) {
              type = 'SM'; length = 16; width = 8;
            } else if (rand < probKR) {
              type = 'KR'; length = 28; width = 14; sublane = (Math.random() < 0.5 ? -6 : 6);
            } else {
              type = 'KB'; length = 46; width = 17; sublane = (Math.random() < 0.5 ? -6 : 6);
            }

            vehicles.push({
              id: idCounter++,
              dir,
              dist: 25 + i * 24 + Math.random() * 8, // staged distance along road
              type,
              length,
              width,
              sublane,
              color: carColors[Math.floor(Math.random() * carColors.length)],
              helmetColor: helmetColors[Math.floor(Math.random() * helmetColors.length)],
              jacketColor: Math.random() < 0.4 ? '#16a34a' : '#1e293b', // Gojek/Grab green or casual dark
              isTruck: Math.random() < 0.5,
              maxSpeed: type === 'SM' ? 2.2 : (type === 'KR' ? 1.9 : 1.3),
              speed: type === 'SM' ? 2.0 : (type === 'KR' ? 1.8 : 1.2),
              isBraking: false,
              inQueue: false,
              turn: Math.random() < 0.2 ? 'LT' : (Math.random() < 0.8 ? 'ST' : 'RT')
            });
          }
        });

        vehiclesRef.current = vehicles;
      }, [approaches, is3Way, omitted]);

      // Determine signal state & exact countdown seconds for a given phase
      const getPhaseStatus = (phaseNum) => {
        const phaseTiming = signalPlan.phases.find(p => p.phase === phaseNum);
        if (!phaseTiming) return { state: 'RED', label: 'MERAH', seconds: 0, color: '#ef4444' };

        const { startGreen, endGreen, amberDuration, allRedDuration } = phaseTiming;
        const cur = elapsedCycleTime;
        const endAmber = endGreen + amberDuration;

        if (cur >= startGreen && cur < endGreen) {
          const sec = Math.ceil(endGreen - cur);
          return { state: 'GREEN', label: 'HIJAU', seconds: sec, color: '#10b981' };
        } else if (cur >= endGreen && cur < endAmber) {
          const sec = Math.ceil(endAmber - cur);
          return { state: 'AMBER', label: 'KUNING', seconds: sec, color: '#f59e0b' };
        } else {
          // Red phase
          let sec = 0;
          if (cur < startGreen) {
            sec = Math.ceil(startGreen - cur);
          } else {
            sec = Math.ceil((cycleTime - cur) + startGreen);
          }
          return { state: 'RED', label: 'MERAH', seconds: sec, color: '#ef4444' };
        }
      };

      // Simulation main loop
      useEffect(() => {
        let lastTime = performance.now();

        const updateSimulation = (now) => {
          const dt = (now - lastTime) / 1000;
          lastTime = now;

          if (isPlaying && cycleTime > 0) {
            setElapsedCycleTime((prev) => (prev + dt * simSpeed) % cycleTime);
          }

          updateVehiclePhysics();
          renderCanvas();
          animFrameRef.current = requestAnimationFrame(updateSimulation);
        };

            }
          } else if (dir === 'W') {
            const ry = cy - wEW / 2 - 2;
            const x0 = cx - wNS / 2;
            const xEnd = x0 - (maxQueueDist > 0 ? maxQueueDist : 0);

            if (isRed && maxQueueDist > 15) {
              ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
              ctx.fillRect(xEnd, cy - wEW / 2, maxQueueDist, wEW / 2);

              ctx.strokeStyle = '#ef4444';
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.moveTo(x0, ry); ctx.lineTo(xEnd, ry);
              ctx.stroke();

              ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
              ctx.beginPath();
              ctx.roundRect(xEnd - 35, ry - 24, 70, 18, 4);
              ctx.fill();
              ctx.fillStyle = '#fca5a5';
              ctx.font = 'bold 9px sans-serif';
              ctx.fillText(`Antrean: ${queueMeters}m`, xEnd - 30, ry - 12);
            }
          }
          ctx.restore();
        };

        if (!is3Way || omitted !== 'U') drawCurbQueueRuler('N', uStatus, uApp);
        if (!is3Way || omitted !== 'S') drawCurbQueueRuler('S', sStatus, sApp);
        if (!is3Way || omitted !== 'T') drawCurbQueueRuler('E', tStatus, tApp);
        if (!is3Way || omitted !== 'B') drawCurbQueueRuler('W', bStatus, bApp);

        // --- RENDER TRAFFIC SIGNAL POSTS (ON CORNER SIDEWALKS) ---
        const drawSignalHead = (x, y, status, label) => {
          // Shadow
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.fillRect(x - 11 + 2, y - 26 + 2, 22, 52);

          // Box
          ctx.fillStyle = '#0f172a';
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.roundRect(x - 11, y - 26, 22, 52, 4);
          ctx.fill();
          ctx.stroke();

          // Visors/hoods
          ctx.fillStyle = '#1e293b';
          [-16, 0, 16].forEach(offsetY => {
            ctx.beginPath();
            ctx.arc(x, y + offsetY - 1, 7, Math.PI, 0);
            ctx.stroke();
          });

          // Red light bulb
          ctx.beginPath();
          ctx.arc(x, y - 16, 5.5, 0, Math.PI * 2);
          ctx.fillStyle = status.state === 'RED' ? '#ef4444' : '#450a0a';
          if (status.state === 'RED') {
            ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 12;
          }
          ctx.fill();
          ctx.shadowBlur = 0;

          // Yellow/Amber bulb
          ctx.beginPath();
          ctx.arc(x, y, 5.5, 0, Math.PI * 2);
          ctx.fillStyle = status.state === 'AMBER' ? '#f59e0b' : '#451a03';
          if (status.state === 'AMBER') {
            ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 12;
          }
          ctx.fill();
          ctx.shadowBlur = 0;

          // Green bulb
          ctx.beginPath();
          ctx.arc(x, y + 16, 5.5, 0, Math.PI * 2);
          ctx.fillStyle = status.state === 'GREEN' ? '#10b981' : '#022c22';
          if (status.state === 'GREEN') {
            ctx.shadowColor = '#10b981'; ctx.shadowBlur = 12;
          }
          ctx.fill();
          ctx.shadowBlur = 0;

          // Clean Pill below signal with countdown seconds
          ctx.fillStyle = status.color;
          ctx.beginPath();
          ctx.roundRect(x - 22, y + 30, 44, 16, 4);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`${label} ${status.seconds}s`, x, y + 42);
        };

        // Draw signal posts on corner sidewalks with ample spacing
        if (!is3Way || omitted !== 'U') drawSignalHead(cx + wNS / 2 + 18, cy - wEW / 2 - 38, uStatus, 'U');
        if (!is3Way || omitted !== 'S') drawSignalHead(cx - wNS / 2 - 18, cy + wEW / 2 + 38, sStatus, 'S');
        if (!is3Way || omitted !== 'T') drawSignalHead(cx + wNS / 2 + 38, cy + wEW / 2 + 18, tStatus, 'T');
        if (!is3Way || omitted !== 'B') drawSignalHead(cx - wNS / 2 - 38, cy - wEW / 2 - 18, bStatus, 'B');

        // --- RENDER HIGH-FIDELITY VEHICLES WITH CORRECT ORIENTATIONS ---
        // Indonesian Left-Hand Traffic:
        // - N: comes from North, moves SOUTH (downwards, +Y). Angle = Math.PI (faces South)
        // - S: comes from South, moves NORTH (upwards, -Y). Angle = 0 (faces North)
        // - E: comes from East, moves WEST (leftwards, -X). Angle = -Math.PI / 2 (faces West)
        // - W: comes from West, moves EAST (rightwards, +X). Angle = Math.PI / 2 (faces East)
        vehicles.forEach(v => {
          let vx = 0, vy = 0, angle = 0;
          const laneBaseOffset = (v.type === 'SM') ? 14 : 18;
          const totalOffset = laneBaseOffset + v.sublane;

          if (v.dir === 'N') {
            // Travelling South along North road (on the left side, which is +X)
            vx = cx + totalOffset;
            vy = (cy - wEW / 2) - v.dist;
            angle = Math.PI; // Face South (downwards)!
          } else if (v.dir === 'S') {
            // Travelling North along South road (on the left side, which is -X)
            vx = cx - totalOffset;
            vy = (cy + wEW / 2) + v.dist;
            angle = 0; // Face North (upwards)!
          } else if (v.dir === 'E') {
            // Travelling West along East road (on the left side, which is +Y)
            vx = (cx + wNS / 2) + v.dist;
            vy = cy + totalOffset;
            angle = -Math.PI / 2; // Face West (leftwards)!
          } else if (v.dir === 'W') {
            // Travelling East along West road (on the left side, which is -Y)
            vx = (cx - wNS / 2) - v.dist;
            vy = cy - totalOffset;
            angle = Math.PI / 2; // Face East (rightwards)!
          }

          ctx.save();
          ctx.translate(vx, vy);
          ctx.rotate(angle);

          if (v.type === 'SM') {
            drawMotorcycle(ctx, v);
          } else if (v.type === 'KR') {
            drawCar(ctx, v);
          } else {
            drawHeavyVehicle(ctx, v);
          }
          ctx.restore();
        });

        // --- ELEGANT CORNER HUD CARDS (IN 4 OPEN CORNERS, ZERO OVERLAP) ---
        const drawInfoCard = (x, y, w, h, app, status, armTitle) => {
          ctx.save();
          // Card Container
          ctx.fillStyle = isDark ? 'rgba(15, 23, 42, 0.92)' : 'rgba(255, 255, 255, 0.95)';
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, 8);
          ctx.fill();

          ctx.strokeStyle = status.color;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Header line with Status Pill
          ctx.fillStyle = isDark ? '#ffffff' : '#0f172a';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(armTitle, x + 10, y + 18);

          // Status Badge Pill (e.g. 🟢 HIJAU 14s / 🔴 MERAH 32s)
          ctx.fillStyle = status.color;
          ctx.beginPath();
          ctx.roundRect(x + w - 82, y + 6, 74, 18, 5);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 9.5px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`${status.label} ${status.seconds}s`, x + w - 45, y + 18.5);

          // Sub-stats
          const dirVehicles = vehicles.filter(v => v.dir === (app.id === 'U' ? 'N' : app.id === 'S' ? 'S' : app.id === 'T' ? 'E' : 'W') && v.dist >= 0);
          const queued = dirVehicles.filter(v => v.inQueue || v.isBraking);
          let maxQueueDist = 0;
          if (queued.length > 0) maxQueueDist = Math.max(...queued.map(v => v.dist));
          const simQueueMeters = Math.round(maxQueueDist / scale);
          const pkjiQueueMeters = Math.round(app.queueLength || 35);

          ctx.textAlign = 'left';
          ctx.fillStyle = isDark ? '#94a3b8' : '#475569';
          ctx.font = '10px sans-serif';
          ctx.fillText(`Antrean Riil:`, x + 10, y + 36);
          ctx.font = 'bold 10px sans-serif';
          ctx.fillStyle = queued.length > 0 ? (status.state === 'RED' ? '#f87171' : '#34d399') : (isDark ? '#cbd5e1' : '#1e293b');
          ctx.fillText(`${queued.length} kend (~${simQueueMeters} m)`, x + 80, y + 36);

          ctx.fillStyle = isDark ? '#94a3b8' : '#475569';
          ctx.font = '10px sans-serif';
          ctx.fillText(`Batas PKJI:`, x + 10, y + 51);
          ctx.font = 'bold 10px sans-serif';
          ctx.fillStyle = isDark ? '#cbd5e1' : '#1e293b';
          ctx.fillText(`${pkjiQueueMeters} m  |  C: ${app.C || '-'} smp/j`, x + 80, y + 51);

          ctx.fillStyle = isDark ? '#94a3b8' : '#475569';
          ctx.font = '10px sans-serif';
          ctx.fillText(`Derajat Jenuh:`, x + 10, y + 66);
          ctx.font = 'bold 10px sans-serif';
          ctx.fillStyle = (app.DJ || 0) > 0.85 ? '#f87171' : '#34d399';
          ctx.fillText(`DJ: ${(app.DJ || 0).toFixed(2)} (${(app.DJ || 0) > 0.85 ? 'Jenuh' : 'Baik'})`, x + 80, y + 66);

          ctx.restore();
        };

        // 1. TOP-LEFT: Master Cycle HUD & Approach Barat (B)
        // Master Cycle HUD
        ctx.save();
        ctx.fillStyle = isDark ? 'rgba(15, 23, 42, 0.92)' : 'rgba(255, 255, 255, 0.95)';
        ctx.beginPath();
        ctx.roundRect(14, 14, 280, 58, 8);
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#0284c7';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`SIMULASI SIKLUS: ${elapsedCycleTime.toFixed(1)}s / ${cycleTime}s`, 24, 32);

        const activeP = signalPlan.phases.find(p => getPhaseStatus(p.phase).state === 'GREEN') 
          || signalPlan.phases.find(p => getPhaseStatus(p.phase).state === 'AMBER');
        
        ctx.fillStyle = isDark ? '#ffffff' : '#0f172a';
        ctx.font = '10px sans-serif';
        ctx.fillText(`Fase Aktif: ${activeP ? `Fase ${activeP.phase} (${activeP.approaches.join(', ')})` : 'All-Red / Pengosongan'}`, 24, 47);
        ctx.fillStyle = '#64748b';
        ctx.font = '9.5px sans-serif';
        ctx.fillText(`${is3Way ? 'Simpang 3 Lengan (T-Junction)' : 'Simpang 4 Lengan'}  |  ${simSpeed}x Speed`, 24, 60);
        ctx.restore();

        // Helper to draw omitted badge
        const drawOmittedBadge = (x, y, w, h, label) => {
          ctx.save();
          ctx.fillStyle = isDark ? 'rgba(15, 23, 42, 0.65)' : 'rgba(241, 245, 249, 0.85)';
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, 8);
          ctx.fill();
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.fillStyle = '#f59e0b';
          ctx.font = 'bold 10px sans-serif';
          ctx.fillText(`⚠️ Simpang 3 Lengan (T-Junction)`, x + 12, y + 20);
          ctx.fillStyle = isDark ? '#94a3b8' : '#64748b';
          ctx.font = '9px sans-serif';
          ctx.fillText(`Lengan ${label} Tidak Ada (Buntu)`, x + 12, y + 34);
          ctx.restore();
        };

        // 1. TOP-LEFT: Approach Barat (B)
        if (!is3Way || omitted !== 'B') {
          drawInfoCard(14, 80, 280, 74, bApp, bStatus, `Barat (B) • Fase ${bApp.phase}`);
        } else {
          drawOmittedBadge(14, 80, 280, 48, 'Barat (B)');
        }

        // 2. TOP-RIGHT: Approach Utara (U)
        if (!is3Way || omitted !== 'U') {
          drawInfoCard(W - 294, 14, 280, 74, uApp, uStatus, `Utara (U) • Fase ${uApp.phase}`);
        } else {
          drawOmittedBadge(W - 294, 14, 280, 48, 'Utara (U)');
        }

        // 3. BOTTOM-LEFT: Approach Selatan (S)
        if (!is3Way || omitted !== 'S') {
          drawInfoCard(14, H - 88, 280, 74, sApp, sStatus, `Selatan (S) • Fase ${sApp.phase}`);
        } else {
          drawOmittedBadge(14, H - 64, 280, 48, 'Selatan (S)');
        }

        // 4. BOTTOM-RIGHT: Approach Timur (T)
        if (!is3Way || omitted !== 'T') {
          drawInfoCard(W - 294, H - 88, 280, 74, tApp, tStatus, `Timur (T) • Fase ${tApp.phase}`);
        } else {
          drawOmittedBadge(W - 294, H - 64, 280, 48, 'Timur (T)');
        }
      };

      return (
        <div className="flex flex-col items-center">
          <div className="relative w-full max-w-4xl rounded-2xl overflow-hidden border border-slate-300 dark:border-slate-800 shadow-2xl bg-slate-900">
            <canvas
              ref={canvasRef}
              width={820}
              height={620}
              className="w-full h-auto block"
            />
          </div>

          <div className="mt-4 flex flex-wrap items-center justify-between gap-3 w-full max-w-4xl bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm text-xs">
            <div className="flex items-center gap-2">
              <button
                onClick={() => setIsPlaying(!isPlaying)}
                className={`px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5 transition-colors ${
                  isPlaying 
                    ? 'bg-rose-500 hover:bg-rose-600 text-white' 
                    : 'bg-emerald-500 hover:bg-emerald-600 text-white'
                }`}>
                <i className={`fa-solid fa-${isPlaying ? 'pause' : 'play'}`}></i>
                <span>{isPlaying ? 'Pause' : 'Play'}</span>
              </button>

              <button
                onClick={() => setElapsedCycleTime(0)}
                className="px-3 py-1.5 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg transition-colors flex items-center gap-1">
                <i className="fa-solid fa-rotate-left"></i>
                <span>Reset Siklus</span>
              </button>
            </div>

            <div className="flex items-center gap-2">
              <span className="text-slate-500 font-medium">Kecepatan Animasi:</span>
              {[0.5, 1, 2, 4].map(s => (
                <button
                  key={s}
                  onClick={() => setSimSpeed(s)}
                  className={`px-2.5 py-1 rounded text-xs font-bold transition-colors ${
                    simSpeed === s 
                      ? 'bg-blue-600 text-white shadow' 
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200'
                  }`}>
                  {s}x
                </button>
              ))}
            </div>

            <div className="flex items-center gap-3 text-slate-500 dark:text-slate-400">
              <div className="flex items-center gap-1">
                <span className="inline-block w-3 h-3 rounded-full bg-rose-500 shadow-sm"></span>
                <span>Lampu Rem & Antrean Merah</span>
              </div>
              <div className="flex items-center gap-1">
                <span className="inline-block w-3 h-3 rounded-full bg-emerald-500 shadow-sm"></span>
                <span>Pelepasan Hijau</span>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      const [darkMode, setDarkMode] = useState(false);
      const [activeTab, setActiveTab] = useState('input'); // 'input', 'results', 'simulation'
      const [activeFormTab, setActiveFormTab] = useState('SA-I'); // 'SA-I', 'SA-II', 'SA-III', 'SA-IV', 'SA-V'
      const [guidanceModal, setGuidanceModal] = useState({ isOpen: false, type: null });
      const [appData, setAppData] = useState(DEFAULT_DATA);

      // Initialize Theme
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Handle Project Fields Change
      const handleProjectChange = (field, val) => {
        setAppData(prev => ({
          ...prev,
          project: {
            ...prev.project,
            [field]: val
          }
        }));
      };

      // Handle Approach Fields Change
      const handleApproachChange = (appId, field, val) => {
        setAppData(prev => ({
          ...prev,
          approaches: prev.approaches.map(a => 
            a.id === appId ? { ...a, [field]: val } : a
          )
        }));
      };

      // Handle Approach Flows Change
      const handleFlowChange = (appId, flowKey, val) => {
        setAppData(prev => ({
          ...prev,
          approaches: prev.approaches.map(a => 
            a.id === appId 
              ? { ...a, flows: { ...a.flows, [flowKey]: parseFloat(val) || 0 } }
              : a
          )
        }));
      };

      // Handle Approach Turns Change
      const handleTurnChange = (appId, turnKey, val) => {
        setAppData(prev => ({
          ...prev,
          approaches: prev.approaches.map(a => 
            a.id === appId 
              ? { ...a, turns: { ...a.turns, [turnKey]: parseFloat(val) || 0 } }
              : a
          )
        }));
      };

      // Load Preset
      const loadPreset = (presetKey) => {
        if (PRESET_SCENARIOS[presetKey]) {
          setAppData(JSON.parse(JSON.stringify(PRESET_SCENARIOS[presetKey].data)));
        }
      };

      // --- PKJI 2023 CALCULATION ENGINE ---
      const calculationResults = useMemo(() => {
        const { junctionType = '4-WAY', tJunctionOmitted = 'B', citySize, envType, sideFriction, numPhases, amberTime, allRedTime, cycleTimeDesignOption, manualCycleTime } = appData.project;

        // Filter active approaches for Simpang 3 Lengan (T-Junction) vs Simpang 4 Lengan
        const activeApproaches = appData.approaches.filter(app => {
          if (junctionType === '3-WAY') {
            return app.id !== tJunctionOmitted;
          }
          return true;
        });

        // 1. Correction Factor Fcs
        const Fcs = CITY_SIZE_FACTORS[citySize]?.factor || 1.0;

        // 2. Correction Factor Fsf
        const Fsf = SIDE_FRICTION_MATRIX[envType]?.[sideFriction] || 1.0;

        // Process Approaches & Flows for active approaches
        const approachCalcs = activeApproaches.map(app => {
          const emp = EMP_PKJI[app.type];
          
          // Arus smp/jam
          const qKR = app.flows.KR * emp.KR;
          const qKB = app.flows.KB * emp.KB;
          const qSM = app.flows.SM * emp.SM;
          const qVehicles = app.flows.KR + app.flows.KB + app.flows.SM;
          const qSmp = qKR + qKB + qSM;

          // Proporsi Belok
          const pLT = app.turns.LT / 100;
          const pST = app.turns.ST / 100;
          const pRT = app.turns.RT / 100;

          // Lebar Efektif (We)
          // Berdasarkan PKJI 2023, jika ada LTOR, arus LT dikeluarkan dari waktu hijau
          const effectiveWe = app.We;

          // Arus Jenuh Dasar S0 (skr/jam hijau)
          // PKJI 2023 formula terlindung: S0 = 600 * We (untuk We >= 3m)
          let S0 = 600 * effectiveWe;
          if (app.type === 'O') {
            // Formula terlawan jika ada arus konflik
            S0 = 500 * effectiveWe;
          }

          // Faktor Koreksi Gradien (FG)
          // PKJI 2023: FG = 1.0 - (0.01 * %G)
          const FG = 1.0 - (0.01 * app.gradient);

          // Faktor Koreksi Parkir (Fp)
          // Jika ada parkir on-street dalam 30m: Fp = [p - (1.83 - 0.0024*Lp)*We/3.0 - (Lp/3.0)] ...
          let Fp = 1.0;
          if (app.parkingDist < 30) {
            Fp = Math.max(0.65, 1.0 - (0.15 * (30 - app.parkingDist) / 30));
          }

          // Faktor Koreksi Belok Kanan (FRT)
          // PKJI 2023: untuk terlindung tanpa median, FRT = 1.0 + pRT * 0.26
          let FRT = 1.0;
          if (app.type === 'P' && !app.hasMedian) {
            FRT = 1.0 + (pRT * 0.26);
          }

          // Faktor Koreksi Belok Kiri (FLT)
          let FLT = 1.0;
          if (!app.ltor) {
            FLT = 1.0 - (pLT * 0.16);
          }

          // Arus Jenuh Terkoreksi (S)
          const S = S0 * Fcs * Fsf * FG * Fp * FRT * FLT;

          // Arus pergerakan desain (Q)
          const Q = app.ltor ? (qSmp * (1 - pLT)) : qSmp;

          // Rasio Arus (Y = Q / S)
          const Y = S > 0 ? (Q / S) : 0;

          return {
            ...app,
            emp,
            qKR,
            qKB,
            qSM,
            qVehicles,
            qSmp,
            Q,
            pLT,
            pST,
            pRT,
            S0,
            FG,
            Fp,
            FRT,
            FLT,
            Fcs,
            Fsf,
            S,
            Y
          };
        });

        // 3. Penentuan Rasio Fase Kritis (IFR / Sum Ycrit)
        const phaseGroups = {};
        for (let p = 1; p <= numPhases; p++) {
          phaseGroups[p] = approachCalcs.filter(a => a.phase === p);
        }

        const phaseDetails = [];
        let sumYcrit = 0;

        for (let p = 1; p <= numPhases; p++) {
          const appsInPhase = phaseGroups[p] || [];
          const maxY = appsInPhase.length > 0 ? Math.max(...appsInPhase.map(a => a.Y)) : 0;
          const criticalApp = appsInPhase.find(a => a.Y === maxY) || null;
          sumYcrit += maxY;
          phaseDetails.push({
            phase: p,
            approaches: appsInPhase.map(a => a.id),
            criticalAppId: criticalApp ? criticalApp.id : '-',
            Ycrit: maxY
          });
        }

        // 4. Waktu Hilang Total (L)
        // L = Sum (kuning + all-red)
        const lostTimePerPhase = amberTime + allRedTime;
        const totalLostTime = numPhases * lostTimePerPhase;

        // 5. Waktu Siklus Webster (c)
        // c = (1.5 * L + 5) / (1 - sumYcrit)
        let websterCycle = 0;
        let isOversaturated = false;
        if (sumYcrit >= 0.95) {
          isOversaturated = true;
          websterCycle = 180; // Over-saturated bound
        } else {
          websterCycle = Math.round((1.5 * totalLostTime + 5) / (1 - sumYcrit));
          // Batasan praktis PKJI 2023
          const minC = numPhases * 20;
          const maxC = 160;
          websterCycle = Math.max(minC, Math.min(maxC, websterCycle));
        }

        const designCycleTime = cycleTimeDesignOption === 'manual' ? manualCycleTime : websterCycle;

        // 6. Alokasi Waktu Hijau Efektif (gi)
        // gi = (c - L) * (Ycrit_i / sumYcrit)
        const totalEffectiveGreen = Math.max(10, designCycleTime - totalLostTime);

        const phasesWithTiming = phaseDetails.map((pd, idx) => {
          let greenTime = 0;
          if (sumYcrit > 0) {
            greenTime = Math.round(totalEffectiveGreen * (pd.Ycrit / sumYcrit));
          } else {
            greenTime = Math.round(totalEffectiveGreen / numPhases);
          }
          // Minimal waktu hijau PKJI adalah 10 detik
          greenTime = Math.max(10, greenTime);

          return {
            ...pd,
            greenTime,
            amberDuration: amberTime,
            allRedDuration: allRedTime
          };
        });

        // Hitung timing timeline untuk simulasi kanvas
        let currentTimeline = 0;
        const phasesWithTimeline = phasesWithTiming.map(p => {
          const startGreen = currentTimeline;
          const endGreen = startGreen + p.greenTime;
          currentTimeline = endGreen + p.amberDuration + p.allRedDuration;
          return {
            ...p,
            startGreen,
            endGreen
          };
        });

        // 7. Evaluasi Kapasitas & Kinerja Per Pendekat (SA-IV & SA-V)
        let totalWeightedDelay = 0;
        let totalIntersectionVolume = 0;

        const evaluatedApproaches = approachCalcs.map(app => {
          const phaseInfo = phasesWithTimeline.find(p => p.phase === app.phase) || { greenTime: 20 };
          const g = phaseInfo.greenTime;
          const greenRatio = g / designCycleTime;

          // Kapasitas C = S * (g / c)
          const C = Math.round(app.S * greenRatio);

          // Derajat Kejenuhan DJ = Q / C
          const DJ = C > 0 ? (app.Q / C) : 1.0;

          // Tundaan Lalu Lintas Rata-Rata (DT) PKJI 2023 / Akçelik
          // DT = c * 0.5 * (1 - g/c)^2 / (1 - (g/c) * min(1, DJ)) + NQ2 * 3600 / C
          const term1 = designCycleTime * 0.5 * Math.pow(1 - greenRatio, 2) / (1 - greenRatio * Math.min(1.0, DJ));
          
          let term2 = 0;
          if (DJ > 0.5) {
            // Tundaan akibat antrean acak & kelebihan beban
            const factorSub = (DJ - 1.0);
            const insideSqrt = Math.pow(factorSub, 2) + (8 * (DJ - 0.5) / Math.max(1, C));
            term2 = 1800 * (factorSub + Math.sqrt(Math.max(0, insideSqrt)));
          }

          const DT = term1 + term2;

          // Tundaan Geometrik (DG)
          // DG = (1 - DJ) * pStop * 6 + DJ * 4
          const pStop = Math.min(1.0, 0.8 * (1 - greenRatio) / (1 - greenRatio * Math.min(1.0, DJ)));
          const DG = ((1 - Math.min(1.0, DJ)) * pStop * 6) + (Math.min(1.0, DJ) * 4);

          // Tundaan Total Pendekat T = DT + DG
          const T = DT + DG;

          // Panjang Antrean (PA)
          // NQ1 = smp antrean fase hijau sebelumnya
          let NQ1 = 0;
          if (DJ > 0.5) {
            NQ1 = 0.25 * C * ( (DJ - 1) + Math.sqrt(Math.pow(DJ - 1, 2) + (8 * (DJ - 0.5) / C)) );
          }
          // NQ2 = smp yang datang saat fase merah
          const NQ2 = (app.Q / 3600) * (designCycleTime - g);
          const NQtotal = NQ1 + NQ2;
          const queueLength = (NQtotal * 20) / Math.max(2.5, app.We); // meter

          totalWeightedDelay += (app.Q * T);
          totalIntersectionVolume += app.Q;

          return {
            ...app,
            g,
            greenRatio,
            C,
            DJ,
            DT,
            DG,
            T,
            NQtotal,
            queueLength
          };
        });

        const averageIntersectionDelay = totalIntersectionVolume > 0 
          ? (totalWeightedDelay / totalIntersectionVolume) 
          : 0;

        let losColor = 'bg-emerald-500 text-white';
        let losDesc = 'Arus bebas, tundaan sangat rendah';

          LOS = 'A'; losColor = 'bg-emerald-500 text-white'; losDesc = 'Sangat Baik (Tundaan ≤ 5s)';
        } else if (averageIntersectionDelay <= 15.0) {
          LOS = 'B'; losColor = 'bg-teal-500 text-white'; losDesc = 'Baik (Tundaan 5.1 - 15s)';
        } else if (averageIntersectionDelay <= 25.0) {
          LOS = 'C'; losColor = 'bg-blue-500 text-white'; losDesc = 'Sedang / Stabil (Tundaan 15.1 - 25s)';
        } else if (averageIntersectionDelay <= 40.0) {
          LOS = 'D'; losColor = 'bg-amber-500 text-white'; losDesc = 'Mendekati Tidak Stabil (Tundaan 25.1 - 40s)';
        } else if (averageIntersectionDelay <= 60.0) {
          LOS = 'E'; losColor = 'bg-orange-500 text-white'; losDesc = 'Kapasitas Terlampaui / Kritis (Tundaan 40.1 - 60s)';
        } else {
          LOS = 'F'; losColor = 'bg-rose-600 text-white'; losDesc = 'Jenuh / Macet Parah (Tundaan > 60s)';
        }

        if (LOS === 'A' || LOS === 'B') {

            if (window.confetti && typeof window.confetti === 'function') {
              window.confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
            }
          } catch(e) {}
        }

          tJunctionOmitted,

          Fsf,
          totalLostTime,
          sumYcrit,
          websterCycle,
          designCycleTime,

                    <div className="border-b-2 border-slate-900 dark:border-slate-100 pb-3 mb-4">
                      <div className="text-xs uppercase font-mono tracking-widest text-slate-500">PEDOMAN KAPASITAS JALAN INDONESIA (PKJI 2023)</div>
                      <h2 className="text-lg font-black text-slate-900 dark:text-white uppercase">
                        FORMULIR SA-V : EVALUASI KINERJA, DERAJAT KEJENUHAN, TUNDAAN & TINGKAT PELAYANAN (LOS)
                      </h2>
                    </div>

                    {/* Summary Result Banner */}
                    <div className="mb-5 p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 flex flex-wrap items-center justify-between gap-4">
                      <div>
                        <div className="text-xs font-semibold text-slate-500 uppercase">Tingkat Pelayanan Keseluruhan Simpang (LOS):</div>
                        <div className="flex items-center gap-3 mt-1">
                          <span className={`px-4 py-1 rounded-xl text-xl font-black ${calculationResults.losColor}`}>
                            LEVEL {calculationResults.LOS}
                          </span>
                          <span className="text-sm font-bold text-slate-700 dark:text-slate-200">
                            {calculationResults.losDesc}
                          </span>
                        </div>
                      </div>

                      <div className="text-right">
                        <div className="text-xs font-semibold text-slate-500 uppercase">Tundaan Rata-rata Simpang (T):</div>
                        <div className="text-2xl font-black text-blue-600 dark:text-blue-400 mt-0.5">
                          {calculationResults.averageIntersectionDelay.toFixed(2)} <span className="text-xs font-normal text-slate-500">detik/smp</span>
                        </div>
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-xs text-left border-collapse table-pkji">
                        <thead>
                          <tr className="bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 uppercase font-bold border-y border-slate-300 dark:border-slate-700">
                            <th className="p-2 border border-slate-300 dark:border-slate-700 text-center">Pendekat</th>
                            <th className="p-2 border border-slate-300 dark:border-slate-700 text-center">Arus Q (smp/jam)</th>
                            <th className="p-2 border border-slate-300 dark:border-slate-700 text-center">Kapasitas C</th>
                            <th className="p-2 border border-slate-300 dark:border-slate-700 text-center">Derajat Kejenuhan (DJ)</th>
                            <th className="p-2 border border-slate-300 dark:border-slate-700 text-center">Tundaan Lalu Lintas DT (s)</th>
                            <th className="p-2 border border-slate-300 dark:border-slate-700 text-center">Tundaan Geometrik DG (s)</th>
                            <th className="p-2 border border-slate-300 dark:border-slate-700 text-center font-bold">Tundaan Total T (s)</th>
                            <th className="p-2 border border-slate-300 dark:border-slate-700 text-center">Antrean NQ (smp)</th>
                            <th className="p-2 border border-slate-300 dark:border-slate-700 text-center">Panjang Antrean PA (m)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200 dark:divide-slate-800">
                          {calculationResults.approaches.map(app => (
                            <tr key={app.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40">
                              <td className="p-2 font-bold border border-slate-300 dark:border-slate-700 text-center">{app.id}</td>
                              <td className="p-2 border border-slate-300 dark:border-slate-700 text-center font-mono">{Math.round(app.Q)}</td>
                              <td className="p-2 border border-slate-300 dark:border-slate-700 text-center font-mono">{app.C}</td>
                              <td className="p-2 border border-slate-300 dark:border-slate-700 text-center font-mono font-black">
                                <span className={`px-2 py-0.5 rounded ${
                                  app.DJ > 0.85 
                                    ? 'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300' 
                                    : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300'
                                }`}>
                                  {app.DJ.toFixed(2)}
                                </span>
                              </td>
                              <td className="p-2 border border-slate-300 dark:border-slate-700 text-center font-mono">{app.DT.toFixed(1)}</td>
                              <td className="p-2 border border-slate-300 dark:border-slate-700 text-center font-mono">{app.DG.toFixed(1)}</td>
                              <td className="p-2 border border-slate-300 dark:border-slate-700 text-center font-mono font-bold text-blue-600 dark:text-blue-400">{app.T.toFixed(1)}</td>
                              <td className="p-2 border border-slate-300 dark:border-slate-700 text-center font-mono">{app.NQtotal.toFixed(1)}</td>
                              <td className="p-2 border border-slate-300 dark:border-slate-700 text-center font-mono font-semibold">{Math.round(app.queueLength)} m</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    <FormulaCard
                      title="Evaluasi Derajat Kejenuhan (DJ), Tundaan (Delay) & Panjang Antrean"
                      formula="DJ = \frac{Q}{C} \quad ; \quad T_i = DT_i + DG_i \quad ; \quad T_{simpang} = \frac{\sum (Q_i \times T_i)}{\sum Q_i}"
                      substitute={`Tundaan Simpang = Total (${Math.round(calculationResults.approaches.reduce((acc,a)=>acc+(a.Q*a.T),0))} smp.detik) / Total (${Math.round(calculationResults.approaches.reduce((acc,a)=>acc+a.Q,0))} smp) = ${calculationResults.averageIntersectionDelay.toFixed(2)} detik/smp`}
                      explanation="Derajat kejenuhan (DJ) harus dipertahankan ≤ 0.85 sesuai standar PKJI 2023 untuk mencegah antrean meluber (spill-back). Tundaan lalu lintas (DT) dihitung dengan formula Akçelik yang memadukan tundaan teratur siklus sinyal dengan tundaan stokastik akibat fluktuasi acak arus kendaraan saat mendekati kejenuhan."
                      ruleRef="PKJI 2023 Bagian 2, Pasal 4.5 (Evaluasi Kinerja Simpang APILL)"
                    />
                  </div>
                )}

              </div>
            )}

            {/* TAB 3: 2D TOP-DOWN SIMULATION */}
            {activeTab === 'simulation' && (
              <div className="space-y-6">
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                  <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div>
                      <h2 className="text-base font-bold text-slate-800 dark:text-white flex items-center gap-2">
                        <i className="fa-solid fa-gamepad text-blue-500"></i>
                        Simulasi Visual Top-Down Simpang APILL (PKJI 2023)
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                        Lampu APILL dan pergerakan kendaraan bergerak sinkron secara real-time dengan alokasi waktu siklus Webster Formulir SA-III.
                      </p>
                    </div>

                    <div className="flex items-center gap-2 text-xs">
                      <span className="px-2.5 py-1 bg-slate-100 dark:bg-slate-800 rounded-lg font-semibold text-slate-700 dark:text-slate-300">
                        Total Siklus (c): {calculationResults.designCycleTime}s
                      </span>
                      <span className={`px-2.5 py-1 rounded-lg font-bold ${calculationResults.losColor}`}>
                        LOS {calculationResults.LOS}
                      </span>
                    </div>
                  </div>

                  <TopDownSimulation
                    approaches={calculationResults.approaches}
                    signalPlan={calculationResults.signalPlan}
                    cycleTime={calculationResults.designCycleTime}
                    junctionType={appData.project.junctionType || '4-WAY'}
                    tJunctionOmitted={appData.project.tJunctionOmitted || 'B'}
                  />

                  {/* Approach Live Status Table */}
                  <div className="mt-6 border-t border-slate-100 dark:border-slate-800 pt-4">
                    <h3 className="text-xs font-bold text-slate-700 dark:text-slate-300 mb-3 uppercase tracking-wider">
                      Status Operasional Tiap Lengan Simpang:
                    </h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                      {calculationResults.approaches.map(app => (
                        <div 
                          key={app.id}
                          className="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-800 text-xs space-y-1">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-slate-800 dark:text-white">Lengan {app.id} ({app.name.split(' ')[0]})</span>
                            <span className="px-1.5 py-0.5 bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300 rounded font-bold text-[10px]">
                              Fase {app.phase}
                            </span>
                          </div>
                          <div className="text-slate-500 flex justify-between">
                            <span>Waktu Hijau (g):</span>
                            <span className="font-semibold text-slate-700 dark:text-slate-200">{app.g} detik</span>
                          </div>
                          <div className="text-slate-500 flex justify-between">
                            <span>Derajat Kejenuhan:</span>
                            <span className={`font-bold ${app.DJ > 0.85 ? 'text-rose-500' : 'text-emerald-500'}`}>
                              {app.DJ.toFixed(2)}
                            </span>
                          </div>
                          <div className="text-slate-500 flex justify-between">
                            <span>Panjang Antrean:</span>
                            <span className="font-semibold text-slate-700 dark:text-slate-200">{Math.round(app.queueLength)} m</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* ACADEMIC FOOTER */}
          <footer className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 mt-12 text-center text-xs text-slate-500 dark:text-slate-400 no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 space-y-2">
              <div className="flex items-center justify-center gap-2">
                <img
                  src="https://upload.wikimedia.org/wikipedia/commons/4/43/Logo_UNTIDAR_%28Universitas_Tidar%29_Magelang.png"
                  alt="UNTIDAR"
                  className="h-5 w-auto object-contain"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
                <span className="font-bold text-slate-700 dark:text-slate-200">
                  SIMPASI • Universitas Tidar (UNTIDAR) Magelang
                </span>
              </div>
              <p>
                Dikembangkan berdasarkan <strong>Pedoman Kapasitas Jalan Indonesia (PKJI 2023)</strong> • Ditjen Bina Marga Kementerian PUPR
              </p>
              <p className="text-[11px] text-slate-400">
                Fakultas Teknik - Program Studi Teknik Sipil Universitas Tidar. Sepenuhnya interaktif, transparan, dan siap cetak formulir SA Series.
              </p>
            </div>
          </footer>
        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
